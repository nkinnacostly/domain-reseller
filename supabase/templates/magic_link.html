<!doctype html>
<html lang="en">
  <body style="margin:0;padding:32px 16px;background:#f4f6f6;font-family:Arial,Helvetica,sans-serif;color:#0f1f24">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#ffffff;border-radius:16px;padding:32px">
            <tr><td style="font-size:14px;font-weight:bold;letter-spacing:2px">MYDOMAINSHUB</td></tr>
            <tr><td style="padding-top:24px;font-size:22px;font-weight:bold">Your sign-in link</td></tr>
            <tr><td style="padding-top:12px;font-size:15px;line-height:22px;color:#4a5a5f">Tap the button to sign in. The link works once and expires in an hour.</td></tr>
            <tr>
              <td style="padding-top:24px">
                <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=email&amp;next={{ .RedirectTo }}" style="display:inline-block;background:#2563eb;color:#ffffff;text-decoration:none;font-weight:bold;padding:12px 24px;border-radius:999px">Sign in</a>
              </td>
            </tr>
            <tr><td style="padding-top:24px;font-size:13px;line-height:20px;color:#6b7174">If you didn't ask to sign in, ignore this email. Nobody can sign in without this link.</td></tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
