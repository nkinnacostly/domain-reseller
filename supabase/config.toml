project_id = "domain-reseller"

[api]
enabled = true
port = 54321
# `mail`: MyDomainsHub Mail (docs/MAIL-SPEC.md, M5), RLS on every table.
schemas = ["public", "graphql_public", "mail"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = true
default_pool_size = 15
max_client_conn = 200

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
# Production first; the app also passes its own redirect on every auth email.
site_url = "https://www.mydomainshub.com"
additional_redirect_urls = [
  "https://www.mydomainshub.com/**",
  "https://mydomainshub.com/**",
  "https://mydomainshub.vercel.app/**",
  "http://localhost:3000/**",
  "http://localhost:3100/**",
  # MyDomainsHub Mail shares Supabase Auth (MAIL-SPEC M5).
  "https://emails.mydomainshub.com/**",
  "http://localhost:3001/**",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

[auth.rate_limit]
# Emails Supabase Auth may send per hour, across all users. Custom SMTP
# (Brevo, below) lifts the built-in sender's cap; Brevo's free plan allows 300
# a day.
email_sent = 100

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
# Off: we verify the current password ourselves before a change, which
# avoids an extra email round-trip (see features/auth/actions).
secure_password_change = false
# Stated so `supabase config push` keeps the hosted values; left unset, the
# CLI's local defaults (1s, 6 digits) overwrote them on 23 Sept 2026.
max_frequency = "1m0s"
otp_length = 8

# Auth emails go out through Amazon SES (eu-west-2) from the authenticated
# subdomain notify.mydomainshub.com (DKIM and MAIL FROM in Cloudflare) since the
# cutover on 3 Oct 2026 (docs/DEPLOY.md §5c); Brevo before it. The built-in
# sender only reached the Supabase organisation's members (L1). The SES SMTP
# credentials come from the environment at push time, never this file:
#   set -a; . ./.env; set +a; supabase config push
[auth.email.smtp]
enabled = true
host = "email-smtp.eu-west-2.amazonaws.com"
port = 587
user = "env(SES_SMTP_USERNAME)"
pass = "env(SES_SMTP_PASSWORD)"
admin_email = "no-reply@notify.mydomainshub.com"
sender_name = "MyDomainsHub"

# Every auth email goes to our own route instead (Send Email hook), which sends
# it through EMAIL_PROVIDER's API (Brevo, or Amazon SES) from no-reply@ with
# Reply-To hello@ — SMTP cannot set a Reply-To. SMTP above stays configured:
# with the hook disabled, Supabase falls back to it. Enable only once the route
# and its env vars (the provider's key, SEND_EMAIL_HOOK_SECRET) are live on
# Vercel, or auth email stops.
[auth.hook.send_email]
enabled = true
uri = "https://www.mydomainshub.com/api/auth/send-email"
secrets = "env(SEND_EMAIL_HOOK_SECRET)"

# Token-hash links to /auth/confirm, which work when the email is opened on
# another device (L2). Needs custom SMTP: the free tier refuses template
# changes on the built-in sender.
[auth.email.template.confirmation]
subject = "Confirm your email"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Reset your password"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.magic_link]
subject = "Your sign-in link"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.email_change]
subject = "Confirm your new email"
content_path = "./supabase/templates/email_change.html"

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

# FR-A1: "Continue with Google". The OAuth client lives in the owner's Google
# Cloud project; its redirect URI is this project's /auth/v1/callback. The id
# and secret are env() values from the root .env — `supabase config push`
# needs both set (docs/DEPLOY.md). The web shows the button only once this is
# on (features/auth/queries/providers.ts).
[auth.external.google]
enabled = true
client_id = "env(GOOGLE_OAUTH_CLIENT_ID)"
secret = "env(GOOGLE_OAUTH_CLIENT_SECRET)"
redirect_uri = ""
url = ""
skip_nonce_check = false

[storage]
enabled = true
file_size_limit = "50MiB"

[edge_runtime]
enabled = true
policy = "oneshot"
