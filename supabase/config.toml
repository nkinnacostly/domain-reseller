project_id = "domain-reseller"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = true
default_pool_size = 15
max_client_conn = 200

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
# Production first; the app also passes its own redirect on every auth email.
site_url = "https://www.mydomainshub.com"
additional_redirect_urls = [
  "https://www.mydomainshub.com/**",
  "https://mydomainshub.com/**",
  "https://mydomainshub.vercel.app/**",
  "http://localhost:3000/**",
  "http://localhost:3100/**",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

[auth.rate_limit]
# Emails Supabase Auth may send per hour, across all users. Custom SMTP
# (Brevo, below) lifts the built-in sender's cap; Brevo's free plan allows 300
# a day.
email_sent = 100

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
# Off: we verify the current password ourselves before a change, which
# avoids an extra email round-trip (see features/auth/actions).
secure_password_change = false
# Stated so `supabase config push` keeps the hosted values; left unset, the
# CLI's local defaults (1s, 6 digits) overwrote them on 23 Sept 2026.
max_frequency = "1m0s"
otp_length = 8

# Auth emails go out through Brevo from the authenticated subdomain
# notify.mydomainshub.com (SPF, DKIM, DMARC in Cloudflare, 24 Sept 2026) — the
# built-in sender only reached the Supabase organisation's members (L1). The
# login and key come from the environment at push time, never this file:
#   set -a; . ./.env; set +a; supabase config push
[auth.email.smtp]
enabled = true
host = "smtp-relay.brevo.com"
port = 587
user = "env(BREVO_SMTP_LOGIN)"
pass = "env(BREVO_SMTP_KEY)"
admin_email = "no-reply@notify.mydomainshub.com"
sender_name = "MyDomainsHub"

# Every auth email goes to our own route instead (Send Email hook), which sends
# it through Brevo's API from no-reply@ with Reply-To hello@ — SMTP cannot set
# a Reply-To. SMTP above stays configured: with the hook disabled, Supabase
# falls back to it. Enable only once the route and its env vars (BREVO_API_KEY,
# SEND_EMAIL_HOOK_SECRET) are live on Vercel, or auth email stops.
[auth.hook.send_email]
enabled = true
uri = "https://www.mydomainshub.com/api/auth/send-email"
secrets = "env(SEND_EMAIL_HOOK_SECRET)"

# Token-hash links to /auth/confirm, which work when the email is opened on
# another device (L2). Needs custom SMTP: the free tier refuses template
# changes on the built-in sender.
[auth.email.template.confirmation]
subject = "Confirm your email"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Reset your password"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.magic_link]
subject = "Your sign-in link"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.email_change]
subject = "Confirm your new email"
content_path = "./supabase/templates/email_change.html"

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[storage]
enabled = true
file_size_limit = "50MiB"

[edge_runtime]
enabled = true
policy = "oneshot"
