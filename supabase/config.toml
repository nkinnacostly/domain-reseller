project_id = "domain-reseller"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = true
default_pool_size = 15
max_client_conn = 200

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = [
  "http://localhost:3000/**",
  "http://localhost:3100/**",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
# Off: we verify the current password ourselves before a change, which
# avoids an extra email round-trip (see features/auth/actions).
secure_password_change = false

# Custom templates link to /auth/confirm with a token hash, which works when the
# email is opened on another device. The hosted free tier refuses template
# changes on Supabase's built-in email sender — enable these once custom SMTP
# is configured (see CLAUDE.md §15).
# [auth.email.template.confirmation]
# subject = "Confirm your email"
# content_path = "./supabase/templates/confirmation.html"

# [auth.email.template.recovery]
# subject = "Reset your password"
# content_path = "./supabase/templates/recovery.html"

# [auth.email.template.magic_link]
# subject = "Your sign-in link"
# content_path = "./supabase/templates/magic_link.html"

# [auth.email.template.email_change]
# subject = "Confirm your new email"
# content_path = "./supabase/templates/email_change.html"

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[storage]
enabled = true
file_size_limit = "50MiB"

[edge_runtime]
enabled = true
policy = "oneshot"
