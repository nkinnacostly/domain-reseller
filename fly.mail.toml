# MyDomainsHub Mail's worker on Fly.io (docs/MAIL-SPEC.md §3, §11). A separate
# app from the gateway. Deploy from the repository root:
#   fly deploy -c fly.mail.toml --ha=false
# One machine only: the SES account's send rate is one shared budget (MR8),
# and this worker paces itself as if it had Mail's whole share of it.
# Secrets are set with `fly secrets set -c fly.mail.toml`:
#   NEXT_PUBLIC_SUPABASE_URL, SUPABASE_SECRET_KEY,
#   MAIL_SES_SENDER_ACCESS_KEY_ID, MAIL_SES_SENDER_SECRET_ACCESS_KEY,
#   MAIL_WEBHOOK_SECRET_KEY (the same value as the Mail Vercel project's: it
#   opens each endpoint's sealed signing secret, MR6),
#   MAIL_SAFETY_SECRET (the same value as the Mail Vercel project's: the ping
#   that asks apps/mail to apply a queued SES pause, §7.4)
app = "mydomainshub-mail-worker"
primary_region = "lhr"

[build]
  dockerfile = "apps/mail-worker/Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  LOG_LEVEL = "info"
  MAIL_SES_REGION = "eu-west-2"
  # MR8: Mail's share of the account's 14 a second; the shop keeps 4 (§4.4).
  MAIL_MAX_SEND_RATE = "10"
  # §7.4: apps/mail holds the manager key and applies the SES pauses this worker queues.
  MAIL_APP_URL = "https://emails.mydomainshub.com"

[http_service]
  internal_port = 8080
  force_https = true
  # The send loop runs inside this process; it must never be stopped for idling.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
