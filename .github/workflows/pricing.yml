name: Pricing data

# Prices only change when these jobs run, so they run on a schedule.
# The FX rate moves daily. The supplier catalogue is synced weekly by the
# gateway itself (apps/gateway/src/catalogue/schedule.ts): once the supplier
# allowlists the gateway's address, a runner here cannot call it.
on:
  schedule:
    - cron: '0 7 * * *'    # 08:00 WAT, daily — exchange rate
  workflow_dispatch:
    inputs:
      job:
        description: Which job to run
        type: choice
        options: [fx]
        default: fx

concurrency:
  group: pricing-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      FX_PARALLEL_API_KEY: ${{ secrets.FX_PARALLEL_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile

      # The scripts read the workspace .env; in CI the values come from secrets.
      - name: Write env
        run: |
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$NEXT_PUBLIC_SUPABASE_URL"
            echo "SUPABASE_SECRET_KEY=$SUPABASE_SECRET_KEY"
            echo "FX_PARALLEL_API_KEY=$FX_PARALLEL_API_KEY"
          } > .env

      - name: Update exchange rate
        # Exit 3 means the rate moved too far and is waiting for review — a
        # working outcome, not a failure. Anything else fails the run, so a
        # broken feed or key shows up red instead of hiding behind green.
        run: |
          set +e
          pnpm --filter @dr/gateway fx:update -- --apply
          code=$?
          if [ "$code" -eq 3 ]; then
            echo "::warning::Rate held for review (fx_rates.status = pending_review)"
            exit 0
          fi
          exit $code

      # L8: new prices reach the site now rather than within the hour. The
      # route acts only if prices really changed, so it needs no secret.
      - name: Refresh prices on the site
        continue-on-error: true
        run: curl -fsS --max-time 30 -X POST https://www.mydomainshub.com/api/pricing/refresh

      - name: Report held rates
        run: |
          echo "Any rate held for review stays pending until activated."
          echo "Check fx_rates where status = 'pending_review'."
