name: Pricing data

# Prices only change when these jobs run, so they run on a schedule.
# The FX rate moves daily. The supplier catalogue is synced weekly by the
# gateway itself (apps/gateway/src/catalogue/schedule.ts): once the supplier
# allowlists the gateway's address, a runner here cannot call it.
on:
  schedule:
    - cron: '0 7 * * *'    # 08:00 WAT, daily — exchange rate
  workflow_dispatch:
    inputs:
      job:
        description: Which job to run
        type: choice
        # indexnow-all: tell search engines about every page — after launch,
        # or a change that touches the whole site.
        options: [fx, indexnow-all]
        default: fx

concurrency:
  group: pricing-data
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    # The secrets are given to the one step that writes them, not to the whole
    # job: actions and package install scripts never see them (security audit,
    # 8 Oct 2026). Actions are pinned to a commit, not a tag that can move.
    steps:
      - name: Note the start time
        run: echo "JOB_STARTED=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile

      # The scripts read the workspace .env; in CI the values come from secrets.
      - name: Write env
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          FX_PARALLEL_API_KEY: ${{ secrets.FX_PARALLEL_API_KEY }}
        run: |
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$NEXT_PUBLIC_SUPABASE_URL"
            echo "SUPABASE_SECRET_KEY=$SUPABASE_SECRET_KEY"
            echo "FX_PARALLEL_API_KEY=$FX_PARALLEL_API_KEY"
          } > .env

      - name: Update exchange rate
        if: inputs.job != 'indexnow-all'
        # Exit 3 means the rate moved too far and is waiting for review — a
        # working outcome, not a failure. Anything else fails the run, so a
        # broken feed or key shows up red instead of hiding behind green.
        run: |
          set +e
          pnpm --filter @dr/gateway fx:update -- --apply
          code=$?
          if [ "$code" -eq 3 ]; then
            echo "::warning::Rate held for review (fx_rates.status = pending_review)"
            exit 0
          fi
          exit $code

      # L8: new prices reach the site now rather than within the hour. The
      # route acts only if prices really changed, so it needs no secret.
      - name: Refresh prices on the site
        id: refresh
        if: inputs.job != 'indexnow-all'
        continue-on-error: true
        run: |
          out=$(curl -fsS --max-time 30 -X POST https://www.mydomainshub.com/api/pricing/refresh)
          echo "$out"
          echo "refreshed=$(echo "$out" | jq -r '.refreshed // false')" >> "$GITHUB_OUTPUT"

      # IndexNow: when prices really changed, tell Bing (and through it
      # Copilot), Yandex and the other participants which pages did — the
      # sitemap entries dated since this job began. Google reads the sitemap.
      - name: Announce changed pages to search engines
        if: steps.refresh.outputs.refreshed == 'true'
        continue-on-error: true
        run: pnpm --filter @dr/web seo:indexnow -- --since="$JOB_STARTED" --wait

      - name: Announce every page to search engines
        if: inputs.job == 'indexnow-all'
        run: pnpm --filter @dr/web seo:indexnow -- --all

      - name: Report held rates
        run: |
          echo "Any rate held for review stays pending until activated."
          echo "Check fx_rates where status = 'pending_review'."
