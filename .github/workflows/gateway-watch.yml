name: Gateway watch

# The gateway cannot report its own death, so this checks its heartbeat from
# outside and messages the owner on Telegram when it goes quiet (backlog L16).
# Hourly: each run bills a whole minute, and the private repo's free Actions
# minutes are shared with CI and the pricing jobs. Every 30 minutes used
# three-quarters of them on its own.
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

concurrency:
  group: gateway-watch
  cancel-in-progress: true

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: scripts
      # setup-node v5 caches for the packageManager in package.json on its
      # own, and fails when pnpm is not installed. This job needs no packages.
      - uses: actions/setup-node@v5
        with: { node-version: 22, package-manager-cache: false }
      - name: Check the gateway's heartbeat
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_EVERY_MINUTES: 60
        run: node scripts/check-heartbeat.mjs
