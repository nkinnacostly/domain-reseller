name: CI

# Every push to master and every pull request: lint, types, unit and
# integration tests with their coverage thresholds, the security guardrails,
# and the gateway bundle. One job, one install — this is a private repo on the
# free Actions allowance, shared with the pricing jobs and the gateway watch.
#
# End-to-end tests are not run here: they need the Supabase project and a
# production build, and take longer than the allowance can carry per push.
# They run locally before every commit (CLAUDE.md §11).
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SKIP_ENV_VALIDATION: 'true'

permissions:
  contents: read

jobs:
  verify:
    name: Lint · Types · Tests · Guardrails
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # SEC-6 — the secret key must never be reachable from the browser. Any
      # module that reads it imports 'server-only', which turns a browser
      # import into a build error. (env.ts only declares it: t3-env refuses
      # server variables on the client at runtime.)
      - name: Service-role key is server-only
        run: |
          bad=0
          for file in $(grep -rl "SUPABASE_SECRET_KEY" apps/web/src --include='*.ts' --include='*.tsx' \
                        | grep -v "/__tests__/" | grep -v "apps/web/src/lib/env.ts"); do
            if ! grep -q "^import 'server-only'" "$file"; then
              echo "::error file=$file::reads SUPABASE_SECRET_KEY without import 'server-only'"
              bad=1
            fi
          done
          exit $bad

      # L1 — the SES signing key is server-only too: @dr/shared/ses is imported
      # only from modules that import 'server-only'.
      - name: SES credentials are server-only
        run: |
          bad=0
          for file in $(grep -rlE "AWS_SES_SECRET_ACCESS_KEY|@dr/shared/ses" apps/web/src --include='*.ts' --include='*.tsx' \
                        | grep -v "/__tests__/" | grep -v "apps/web/src/lib/env.ts"); do
            if ! grep -q "^import 'server-only'" "$file"; then
              echo "::error file=$file::uses the SES key or client without import 'server-only'"
              bad=1
            fi
          done
          exit $bad

      # MAIL-SPEC §4.3, N6 — in apps/mail the secret key, the API key pepper,
      # the SES manager key and the SES client are read only by modules that
      # import 'server-only'.
      - name: Mail's secrets are server-only
        run: |
          bad=0
          for file in $(grep -rlE "SUPABASE_SECRET_KEY|MAIL_API_KEY_PEPPER|MAIL_SES_MANAGER_|requireApiKeyPepper|requireSesManagerEnv|@dr/shared/ses|@/lib/supabase/service" apps/mail/src --include='*.ts' --include='*.tsx' \
                        | grep -v "/__tests__/" | grep -v "\.test\.tsx\?$" | grep -v "apps/mail/src/lib/env.ts"); do
            if ! grep -q "^import 'server-only'" "$file"; then
              echo "::error file=$file::reads a Mail secret without import 'server-only'"
              bad=1
            fi
          done
          exit $bad

      # MAIL-SPEC §4.3 — only the mail worker holds the key that can send.
      - name: Mail's sending key stays in the worker
        run: |
          if grep -rn "MAIL_SES_SENDER_" apps/mail apps/web --include='*.ts' --include='*.tsx'; then
            echo "::error::MAIL_SES_SENDER_* belongs to apps/mail-worker alone"
            exit 1
          fi

      # MAIL-SPEC §4.3, §6 "SMTP" — the relay takes SMTP from the internet and
      # queues through SQL; it never holds a sending key or the SES client.
      - name: The SMTP relay cannot send
        run: |
          if grep -rnE "MAIL_SES_|@dr/shared/ses|createTenantSender" apps/mail-smtp/src --include='*.ts'; then
            echo "::error::apps/mail-smtp queues through SQL; only apps/mail-worker sends"
            exit 1
          fi

      # SEC-5 — supplier credentials belong to the gateway alone.
      - name: Supplier credentials stay in the gateway
        run: |
          if grep -rn "DNA_API_KEY\|DNA_RESELLER_ID" apps/web/src --include='*.ts' --include='*.tsx'; then
            echo "::error::DomainNameAPI credentials must not appear in apps/web"
            exit 1
          fi

      # N1, ADMIN-SPEC §4.2 — the supplier's REST host, its key header and its
      # reseller path segment belong to the gateway's admin module alone.
      - name: Supplier API stays in the gateway
        run: |
          if grep -rn "domainresellerapi\.com\|X-API-KEY\|__reseller" apps/web/src --include='*.ts' --include='*.tsx'; then
            echo "::error::DomainNameAPI's REST API must not be called from apps/web"
            exit 1
          fi

      # ADR-006 — the admin area reads with the service client only through
      # adminDb (features/admin/queries/session.ts), never directly.
      - name: Admin code reaches the service client only through adminDb
        run: |
          bad=$(grep -rlE "@/lib/supabase/(service|admin)['\"]" apps/web/src/features/admin "apps/web/src/app/(admin)" \
                  --include='*.ts' --include='*.tsx' \
                | grep -v "/__tests__/" | grep -v "apps/web/src/features/admin/queries/session.ts" || true)
          if [ -n "$bad" ]; then
            for file in $bad; do echo "::error file=$file::imports the service client outside adminDb"; done
            exit 1
          fi

      # ADMIN-SPEC §4.1 — the admin gateway secret is read only on the server.
      - name: Admin gateway secret is server-only
        run: |
          bad=0
          for file in $(grep -rlE "GATEWAY_ADMIN_SECRET|requireAdminGatewayEnv" apps/web/src --include='*.ts' --include='*.tsx' \
                        | grep -v "/__tests__/" | grep -v "apps/web/src/lib/env.ts"); do
            if ! grep -q "^import 'server-only'" "$file"; then
              echo "::error file=$file::reads the admin gateway secret without import 'server-only'"
              bad=1
            fi
          done
          exit $bad

      # SEC-14 — supplier SDK telemetry stays off (NDPA).
      - name: Supplier SDK telemetry disabled
        run: |
          if ! grep -q "telemetry: false" apps/gateway/src/dna/client.ts; then
            echo "::error::nodejs-dna must be constructed with { telemetry: false }"
            exit 1
          fi

      - name: Lint and format
        run: pnpm biome ci .

      - name: Types
        run: pnpm turbo run typecheck

      - name: Unit and integration tests, with coverage thresholds
        run: pnpm turbo run test:coverage

      # Vercel builds the web app on every push; the gateway ships from here.
      - name: Gateway bundle
        run: pnpm --filter @dr/gateway build

      # MyDomainsHub Mail's worker ships from here too (fly.mail.toml).
      - name: Mail worker bundle
        run: pnpm --filter @dr/mail-worker build

      # And its SMTP relay (fly.smtp.toml).
      - name: Mail SMTP relay bundle
        run: pnpm --filter @dr/mail-smtp build

      # A critical advisory in what we ship fails the build (security audit,
      # 8 Oct 2026: next 16.3.5 had one and CI stayed green). High and below
      # are reported, not fatal.
      - name: Dependency audit (critical fails the build)
        run: pnpm audit --prod --audit-level=critical
      - name: Dependency audit (everything, reported)
        run: pnpm audit --audit-level=high
        continue-on-error: true

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage
          path: '**/coverage/lcov.info'
          retention-days: 7
