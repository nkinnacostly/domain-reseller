# MyDomainsHub Mail's SMTP relay on Fly.io (docs/MAIL-SPEC.md §6, "SMTP"). A
# separate app from the worker, so the process that takes SMTP from the
# internet never holds the key that can send. Deploy from the repository root:
#   fly deploy -c fly.smtp.toml
# Fly's proxy ends TLS on 465 and 2465 with Fly's certificate for
# smtp.mydomainshub.com (`fly certs add smtp.mydomainshub.com -c fly.smtp.toml`)
# and hands the relay plain SMTP on 2525, which nothing else exposes. SMTP on
# custom ports needs the app's own IPv4 (`fly ips allocate-v4 -c fly.smtp.toml`).
# Secrets are set with `fly secrets set -c fly.smtp.toml`:
#   NEXT_PUBLIC_SUPABASE_URL, SUPABASE_SECRET_KEY, MAIL_API_KEY_PEPPER (the same
#   value as the Mail Vercel project's: keys are looked up by its hash)
# Never an SES key: the relay queues, and only the mail worker sends (§4.3).
app = "mydomainshub-mail-smtp"
primary_region = "lhr"

[build]
  dockerfile = "apps/mail-smtp/Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  SMTP_PORT = "2525"
  SMTP_HOSTNAME = "smtp.mydomainshub.com"
  LOG_LEVEL = "info"

[[services]]
  internal_port = 2525
  protocol = "tcp"
  # A mail program connects whenever it has an email: never stopped for idling.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  # Implicit TLS (RFC 8314): the client speaks TLS from the first byte.
  [[services.ports]]
    port = 465
    handlers = ["tls"]
    [services.ports.tls_options]
      versions = ["TLSv1.2", "TLSv1.3"]

  # The same, for networks that block 465.
  [[services.ports]]
    port = 2465
    handlers = ["tls"]
    [services.ports.tls_options]
      versions = ["TLSv1.2", "TLSv1.3"]

  [services.concurrency]
    type = "connections"
    soft_limit = 250
    hard_limit = 300

  [[services.tcp_checks]]
    grace_period = "10s"
    interval = "15s"
    timeout = "2s"

[checks]
  [checks.health]
    type = "http"
    port = 8080
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
